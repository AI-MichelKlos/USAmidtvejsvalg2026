name: Inspect original ChatGPT Sites deployment
on:
  push:
    paths:
      - '.github/workflows/inspect-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public original site assets
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, html.parser, re
          url = 'https://valgkort-usa-2026-michel.danske-a-kas-7580.chatgpt.site/'
          class Parser(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.items=[]
              def handle_starttag(self, tag, attrs):
                  if tag in ('script','link','img','base'):
                      a=dict(attrs); self.items.append((tag,{k:v for k,v in a.items() if k in ('src','href','rel','type','crossorigin','integrity')}))
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=25) as response:
                  raw=response.read(); print('HTTP STATUS:',response.status); print('CONTENT TYPE:',response.headers.get('Content-Type')); print('FINAL URL:',response.url)
              text=raw.decode('utf-8','replace'); print('HTML SIZE:',len(raw)); print('HTML BEGIN:',text[:1600].replace('\n',' '))
              p=Parser();p.feed(text); print('ASSET TAGS:',p.items[:80]); print('TITLE MATCH:',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:3]);
              print('HAS CONTENT DEMOGRAPHY:', any(v in text for v in ['Median husstandsindkomst','Født i udlandet','Illinois']))
          except Exception as exc:
              print('FETCH ERROR:',type(exc).__name__,str(exc));raise
          PY
