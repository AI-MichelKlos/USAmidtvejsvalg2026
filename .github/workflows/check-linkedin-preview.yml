name: Validate public LinkedIn cards
on:
  push:
    paths:
      - '.github/workflows/check-linkedin-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public HTML and social image as LinkedInBot
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlparse, urljoin
          cases=[
            "https://ai-michelklos.github.io/USAmidtvejsvalg/",
            "https://ai-michelklos.github.io/USAmidtvejsvalg2026/",
            "https://ai-michelklos.github.io/USAmidtvejsvalg/del-linkedin-2026.html",
            "https://ai-michelklos.github.io/USAmidtvejsvalg2026/del-linkedin-2026.html",
            "https://ai-michelklos.github.io/USAmidtvejsvalg/?utm_source=chatgpt.com&view=senate&state=IL&rev=20261031",
          ]
          class Tags(HTMLParser):
            def __init__(self): super().__init__();self.meta={};self.canonical=None
            def handle_starttag(self,tag,attrs):
              attrs=dict(attrs)
              if tag=="meta":
                name=attrs.get("property",attrs.get("name"))
                if name: self.meta[name]=attrs.get("content")
              elif tag=="link" and attrs.get("rel")=="canonical": self.canonical=attrs.get("href")
          for url in cases:
            request=urllib.request.Request(url,headers={"User-Agent":"LinkedInBot/1.0 (+http://www.linkedin.com)","Accept":"text/html,*/*"})
            with urllib.request.urlopen(request,timeout=30) as response:
              raw=response.read()
              ct=response.headers.get("Content-Type","")
              print("PAGE",url,"status",response.status,"content-type",ct,"size",len(raw),"final URL",response.url)
            if b"<html" not in raw.lower():raise RuntimeError("No HTML returned: "+url)
            parser=Tags();parser.feed(raw.decode("utf-8","replace"))
            for key in ("og:title","og:description","og:url","og:image","og:image:width","og:image:height"):
              print("  ",key,parser.meta.get(key))
              if not parser.meta.get(key):raise RuntimeError("Missing "+key+" at "+url)
            image=parser.meta["og:image"]
            request=urllib.request.Request(image,headers={"User-Agent":"LinkedInBot/1.0 (+http://www.linkedin.com)","Accept":"image/png,image/*;q=0.8,*/*;q=0.5"})
            with urllib.request.urlopen(request,timeout=30) as response:
              img=response.read()
              content=response.headers.get("Content-Type","")
              print("IMAGE",image,"status",response.status,"content-type",content,"bytes",len(img),"final URL",response.url)
            if not img.startswith(bytes.fromhex("89504e470d0a1a0a")):raise RuntimeError("Image not PNG")
            if len(img)>5_000_000 or len(img)<10_000:raise RuntimeError("Image outside expected size")
            import struct
            dims=struct.unpack(">II",img[16:24])
            if dims!=(1200,630):raise RuntimeError("Image dimensions incorrect: "+repr(dims))
            print("  Image dimensions:",dims, "valid")
          PY
