name: Capture real election map for LinkedIn
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_social_preview.py'
      - '.github/workflows/capture-social-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-map-social-image
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare headless browser
        run: |
          python3 -m pip install --quiet --break-system-packages playwright Pillow
          python3 -m playwright install --with-deps chromium
      - name: Screenshot the live election map
        run: python3 scripts/capture_social_preview.py
      - name: Commit screenshot and LinkedIn preview metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-preview-site.png index.html saadan-fungerer-valget.html
          if ! git diff --cached --quiet; then
            git commit -m "Use actual election website screenshot for social previews"
            git push
          fi
